name: Cypress Tests with Artifacts

on: [ push ]

jobs:
  Cypress-Test:
    runs-on: ubuntu-latest
    steps:
      # Étape 1 : Récupérer le code source
      - name: Checkout GitCode
        uses: actions/checkout@v2

      # Étape 2 : Installer les dépendances
      - name: Install Dependencies
        run: npm ci

      # Étape 3 : Exécuter les tests Cypress
      - name: Run Cypress Tests
        uses: cypress-io/github-action@v4
        with:
          command: npx cypress run --spec "cypress/e2e/play/pro/v3/*.cy.js"
          browser: chrome

      # Étape 4 : Télécharger les captures d'écran en cas d'échec
      - name: Upload Cypress Screenshots
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: cypress-screenshots
          path: ./cypress/screenshots

      # Étape 5 : Télécharger les vidéos des tests
      - name: Upload Cypress Videos
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: cypress-videos
          path: ./cypress/videos
